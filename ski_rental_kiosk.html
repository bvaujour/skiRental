
<h2 class="sr-only">Borne de location de ski — composez votre pack article par article</h2>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.kiosk {
  min-height: 560px;
  background: var(--color-background-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  position: relative;
}

.header {
  background: #3C2A1A;
  color: #F5E8D0;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.header-subtitle {
  font-size: 12px;
  color: #C4A882;
  margin-top: 2px;
}

.step-bar {
  background: #2A1E10;
  padding: 0.6rem 1.5rem;
  display: flex;
  gap: 0;
}

.step-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #7A6044;
  flex: 1;
}

.step-item.active { color: #F5E8D0; }
.step-item.done { color: #A0845A; }

.step-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #3C2A1A;
  border: 1.5px solid #7A6044;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: #7A6044;
  flex-shrink: 0;
}

.step-item.active .step-dot {
  background: #A0845A;
  border-color: #A0845A;
  color: #2A1E10;
  font-weight: 500;
}

.step-item.done .step-dot {
  background: #5C4030;
  border-color: #A0845A;
  color: #C4A882;
}

.step-line {
  height: 1px;
  flex: 1;
  background: #3C2A1A;
  margin: 0 4px;
  align-self: center;
}

.step-item.done + .step-line { background: #5C4030; }

.content {
  padding: 1.25rem 1.5rem;
}

.section-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 0.75rem;
}

.size-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.size-btn {
  padding: 6px 14px;
  border-radius: var(--border-radius-md);
  border: 1px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  font-size: 13px;
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.15s;
}

.size-btn:hover { background: var(--color-background-secondary); }
.size-btn.selected { background: #3C2A1A; border-color: #3C2A1A; color: #F5E8D0; }

.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 1rem;
}

.item-card {
  background: var(--color-background-primary);
  border: 1px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  text-align: left;
}

.item-card:hover { border-color: var(--color-border-secondary); background: var(--color-background-secondary); }

.item-card.selected {
  border: 2px solid #3C2A1A;
  background: #FAF5EE;
}

.item-card.out-of-stock {
  opacity: 0.5;
  cursor: not-allowed;
}

.item-icon {
  font-size: 22px;
  color: #A0845A;
  margin-bottom: 6px;
}

.item-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 2px;
}

.item-detail {
  font-size: 12px;
  color: var(--color-text-secondary);
}

.item-stock {
  font-size: 11px;
  margin-top: 4px;
  color: #A32D2D;
}

.check-badge {
  position: absolute;
  top: 8px; right: 8px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #3C2A1A;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: #F5E8D0;
}

.cart-strip {
  background: var(--color-background-secondary);
  border-top: 0.5px solid var(--color-border-tertiary);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cart-items {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.cart-tag {
  background: #F5EDE0;
  color: #3C2A1A;
  border: 0.5px solid #C4A882;
  border-radius: var(--border-radius-md);
  font-size: 12px;
  padding: 3px 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.cart-tag .remove {
  cursor: pointer;
  opacity: 0.6;
  font-size: 11px;
}
.cart-tag .remove:hover { opacity: 1; }

.nav-btns {
  display: flex;
  gap: 8px;
  padding: 0.75rem 1.5rem;
  justify-content: flex-end;
  border-top: 0.5px solid var(--color-border-tertiary);
}

.btn-back {
  padding: 8px 20px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: transparent;
  font-size: 14px;
  color: var(--color-text-secondary);
  cursor: pointer;
}

.btn-next {
  padding: 8px 24px;
  border-radius: var(--border-radius-md);
  border: none;
  background: #3C2A1A;
  color: #F5E8D0;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.btn-next:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  font-size: 14px;
}

.summary-row:last-child { border-bottom: none; }

.summary-label { color: var(--color-text-secondary); }
.summary-value { color: var(--color-text-primary); font-weight: 500; }

.confirm-box {
  text-align: center;
  padding: 2rem 1rem;
}

.confirm-icon {
  font-size: 48px;
  color: #A0845A;
  margin-bottom: 1rem;
}

.confirm-title {
  font-size: 20px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 0.5rem;
}

.confirm-sub {
  font-size: 14px;
  color: var(--color-text-secondary);
  margin-bottom: 1.5rem;
}

.ticket {
  background: var(--color-background-primary);
  border: 1px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 1rem;
  text-align: left;
  margin-bottom: 1rem;
}

.ticket-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--color-text-secondary);
}

.ticket-ref {
  font-weight: 500;
  color: #3C2A1A;
  font-size: 15px;
}
</style>

<div class="kiosk" id="kiosk">
  <div class="header">
    <div>
      <div class="header-title"><i class="ti ti-mountain" aria-hidden="true" style="margin-right:6px"></i>Ski Rental</div>
      <div class="header-subtitle">Composez votre pack équipement</div>
    </div>
    <i class="ti ti-snowflake" aria-hidden="true" style="font-size:28px; color:#C4A882; opacity:0.6"></i>
  </div>

  <div class="step-bar" id="stepBar"></div>

  <div class="content" id="mainContent"></div>

  <div class="cart-strip" id="cartStrip" style="display:none">
    <div class="cart-items" id="cartItems"></div>
  </div>

  <div class="nav-btns" id="navBtns"></div>
</div>

<script>
const STEPS = [
  { id: 'skis', label: 'Skis', icon: 'ti-arrows-vertical' },
  { id: 'chaussures', label: 'Chaussures', icon: 'ti-shoe' },
  { id: 'batons', label: 'Bâtons', icon: 'ti-tool' },
  { id: 'recap', label: 'Récap', icon: 'ti-clipboard-list' },
  { id: 'confirm', label: 'Confirmation', icon: 'ti-circle-check' },
];

const CATALOG = {
  skis: [
    { id: 's1', name: 'Salomon QST', detail: '170 cm — Piste', stock: 3, sizes: ['155','160','165','170','175','180'] },
    { id: 's2', name: 'Atomic Bent', detail: '180 cm — All mountain', stock: 2, sizes: ['160','165','170','175','180'] },
    { id: 's3', name: 'Rossignol Hero', detail: '175 cm — Compétition', stock: 0, sizes: [] },
    { id: 's4', name: 'Volkl Kendo', detail: '170 cm — Freeride', stock: 4, sizes: ['160','165','170','175','180'] },
  ],
  chaussures: [
    { id: 'c1', name: 'Lange RS', detail: 'Rigidité haute', stock: 3, sizes: ['38','39','40','41','42','43','44','45'] },
    { id: 'c2', name: 'Nordica Dobermann', detail: 'Confort maximal', stock: 5, sizes: ['38','39','40','41','42','43','44','45','46'] },
    { id: 'c3', name: 'Salomon X Pro', detail: 'Polyvalent', stock: 2, sizes: ['38','39','40','41','42','43','44'] },
  ],
  batons: [
    { id: 'b1', name: 'Leki Spark', detail: 'Aluminium léger', stock: 6, sizes: ['105','110','115','120','125'] },
    { id: 'b2', name: 'Scott Team Issue', detail: 'Carbon — compétition', stock: 3, sizes: ['105','110','115','120','125','130'] },
    { id: 'b3', name: 'Dynastar Speedtour', detail: 'Réglable 100-120 cm', stock: 4, sizes: ['100-120'] },
  ],
};

let state = {
  step: 0,
  selections: { skis: null, chaussures: null, batons: null },
  sizes: { skis: null, chaussures: null, batons: null },
  ref: null,
};

function genRef() {
  return 'SKI-' + Math.random().toString(36).toUpperCase().slice(2,7);
}

function renderStepBar() {
  const bar = document.getElementById('stepBar');
  bar.innerHTML = STEPS.map((s, i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    const dot = i < state.step ? '<i class="ti ti-check" style="font-size:10px"></i>' : (i + 1);
    const line = i < STEPS.length - 1 ? `<div class="step-line"></div>` : '';
    return `<div class="step-item ${cls}"><div class="step-dot">${dot}</div><span>${s.label}</span></div>${line}`;
  }).join('');
}

function renderCartStrip() {
  const strip = document.getElementById('cartStrip');
  const items = document.getElementById('cartItems');
  const keys = Object.keys(state.selections).filter(k => state.selections[k]);
  if (keys.length === 0) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  items.innerHTML = keys.map(k => {
    const sel = state.selections[k];
    const cat = CATALOG[k].find(x => x.id === sel);
    const sz = state.sizes[k] ? ` (${state.sizes[k]})` : '';
    return `<div class="cart-tag">${cat.name}${sz}</div>`;
  }).join('');
}

function renderNav(backLabel, nextLabel, nextDisabled, nextFn, backFn) {
  const nav = document.getElementById('navBtns');
  nav.innerHTML = '';
  if (backFn) {
    const b = document.createElement('button');
    b.className = 'btn-back';
    b.textContent = backLabel || 'Retour';
    b.onclick = backFn;
    nav.appendChild(b);
  }
  const n = document.createElement('button');
  n.className = 'btn-next';
  n.textContent = nextLabel || 'Suivant';
  n.disabled = nextDisabled;
  n.id = 'btnNext';
  n.onclick = nextFn;
  nav.appendChild(n);
}

function renderCategoryStep(catKey) {
  const content = document.getElementById('mainContent');
  const items = CATALOG[catKey];
  const label = { skis: 'Choisissez vos skis', chaussures: 'Choisissez vos chaussures', batons: 'Choisissez vos bâtons' }[catKey];
  const iconMap = { skis: 'ti-arrows-vertical', chaussures: 'ti-shoe', batons: 'ti-tool' };

  let html = `<div class="section-title">${label}</div>`;
  html += `<div class="item-grid">`;

  items.forEach(item => {
    const selected = state.selections[catKey] === item.id;
    const oos = item.stock === 0;
    html += `<div class="item-card ${selected ? 'selected' : ''} ${oos ? 'out-of-stock' : ''}" 
      data-id="${item.id}" data-cat="${catKey}" ${oos ? '' : 'onclick="selectItem(this)"'}>
      <i class="ti ${iconMap[catKey]} item-icon" aria-hidden="true"></i>
      <div class="item-name">${item.name}</div>
      <div class="item-detail">${item.detail}</div>
      ${oos ? `<div class="item-stock"><i class="ti ti-alert-circle" style="font-size:11px"></i> Rupture de stock</div>` : `<div class="item-detail" style="margin-top:4px">Stock: ${item.stock}</div>`}
      ${selected ? `<div class="check-badge"><i class="ti ti-check"></i></div>` : ''}
    </div>`;
  });

  html += `</div>`;

  if (state.selections[catKey]) {
    const item = items.find(x => x.id === state.selections[catKey]);
    const sizeLabel = catKey === 'chaussures' ? 'Pointure' : 'Taille (cm)';
    html += `<div class="section-title" style="margin-top:0.5rem">${sizeLabel}</div>`;
    html += `<div class="size-row">`;
    item.sizes.forEach(sz => {
      const sel = state.sizes[catKey] === sz;
      html += `<button class="size-btn ${sel ? 'selected' : ''}" onclick="selectSize('${catKey}','${sz}')">${sz}</button>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  updateNextBtn(catKey);
}

function selectItem(el) {
  const id = el.dataset.id;
  const cat = el.dataset.cat;
  state.selections[cat] = id;
  state.sizes[cat] = null;
  renderCategoryStep(cat);
  renderCartStrip();
}

function selectSize(cat, sz) {
  state.sizes[cat] = sz;
  renderCategoryStep(cat);
  renderCartStrip();
  updateNextBtn(cat);
}

function updateNextBtn(cat) {
  const btn = document.getElementById('btnNext');
  if (!btn) return;
  btn.disabled = !(state.selections[cat] && state.sizes[cat]);
}

function renderRecap() {
  const content = document.getElementById('mainContent');
  let html = `<div class="section-title">Récapitulatif de votre pack</div>`;
  html += `<div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); overflow:hidden;">`;

  const cats = [
    { key: 'skis', label: 'Skis', icon: 'ti-arrows-vertical' },
    { key: 'chaussures', label: 'Chaussures', icon: 'ti-shoe' },
    { key: 'batons', label: 'Bâtons', icon: 'ti-tool' },
  ];

  cats.forEach(c => {
    const sel = state.selections[c.key];
    if (!sel) {
      html += `<div class="summary-row" style="padding:10px 1rem;">
        <span class="summary-label"><i class="ti ${c.icon}" aria-hidden="true" style="font-size:15px;margin-right:6px;vertical-align:-2px"></i>${c.label}</span>
        <span style="font-size:13px;color:#A32D2D">Non sélectionné</span>
      </div>`;
    } else {
      const item = CATALOG[c.key].find(x => x.id === sel);
      const sz = state.sizes[c.key];
      const szLabel = c.key === 'chaussures' ? `Pointure ${sz}` : `${sz} cm`;
      html += `<div class="summary-row" style="padding:10px 1rem;">
        <span class="summary-label"><i class="ti ${c.icon}" aria-hidden="true" style="font-size:15px;margin-right:6px;vertical-align:-2px"></i>${c.label}</span>
        <span class="summary-value">${item.name} <span style="font-weight:400;color:var(--color-text-secondary)">— ${szLabel}</span></span>
      </div>`;
    }
  });

  html += `</div>`;
  content.innerHTML = html;
}

function renderConfirm() {
  const content = document.getElementById('mainContent');
  document.getElementById('cartStrip').style.display = 'none';
  state.ref = genRef();

  const cats = [
    { key: 'skis', label: 'Skis', icon: 'ti-arrows-vertical' },
    { key: 'chaussures', label: 'Chaussures', icon: 'ti-shoe' },
    { key: 'batons', label: 'Bâtons', icon: 'ti-tool' },
  ];

  let ticketRows = cats.map(c => {
    const sel = state.selections[c.key];
    if (!sel) return '';
    const item = CATALOG[c.key].find(x => x.id === sel);
    const sz = state.sizes[c.key];
    const szLabel = c.key === 'chaussures' ? `Pointure ${sz}` : `${sz} cm`;
    return `<div class="summary-row">
      <span class="summary-label"><i class="ti ${c.icon}" aria-hidden="true" style="font-size:14px;margin-right:6px;vertical-align:-2px"></i>${c.label}</span>
      <span class="summary-value">${item.name} — ${szLabel}</span>
    </div>`;
  }).join('');

  content.innerHTML = `<div class="confirm-box">
    <i class="ti ti-circle-check confirm-icon" aria-hidden="true"></i>
    <div class="confirm-title">Réservation confirmée !</div>
    <div class="confirm-sub">Présentez ce ticket à l'accueil du magasin</div>
    <div class="ticket">
      <div class="ticket-header">
        <span>Référence</span>
        <span class="ticket-ref">${state.ref}</span>
      </div>
      ${ticketRows}
    </div>
    <button class="btn-next" onclick="resetKiosk()" style="margin-top:0.5rem">
      <i class="ti ti-refresh" aria-hidden="true" style="margin-right:6px"></i>Nouvelle réservation
    </button>
  </div>`;
}

function resetKiosk() {
  state = { step: 0, selections: { skis: null, chaussures: null, batons: null }, sizes: { skis: null, chaussures: null, batons: null }, ref: null };
  render();
}

function render() {
  renderStepBar();
  renderCartStrip();

  const stepId = STEPS[state.step].id;

  if (stepId === 'recap') {
    renderRecap();
    renderNav('Retour', 'Confirmer la réservation', false, () => { state.step++; render(); }, () => { state.step--; render(); });
    return;
  }

  if (stepId === 'confirm') {
    renderConfirm();
    document.getElementById('navBtns').innerHTML = '';
    return;
  }

  const catKey = stepId;
  renderCategoryStep(catKey);

  const isFirst = state.step === 0;
  renderNav(
    'Retour',
    state.step < 3 ? 'Suivant' : 'Voir le récap',
    !(state.selections[catKey] && state.sizes[catKey]),
    () => { state.step++; render(); },
    isFirst ? null : () => { state.step--; render(); }
  );
}

render();
</script>
